# docker-compose.yml

services:
  postgres:
    image: postgres:15-alpine # Alpine is lightweight; 15 is a solid, stable version
    container_name: local-postgres
    environment:
      POSTGRES_USER: flows_db_admin
      POSTGRES_PASSWORD: an_admin_test_password
      POSTGRES_DB: flows_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api_server:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: api-server
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
